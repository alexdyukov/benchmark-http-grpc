name: check_updates

on:
  push:
    branches-ignore:
    - master

jobs:
  check_updates:
    runs-on: ubuntu-latest
    steps:
      - name: Install golang
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
       # TODO: swicth back to `arduino/setup-protoc@v3` after it supports Node 24
      - name: Install Protoc
        uses: StackOverflowExcept1on/setup-protoc@3c8638272249639ffb4bc8571caff93ee0383579
      - name: Checkout git repository
        uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest && \
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest && \
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest && \
          openssl req -x509 -newkey rsa:4096 -sha256 -days 365 -nodes -keyout example.key -out example.crt -subj "/CN=localhost" -addext "subjectAltName = DNS:localhost" && \
          protoc --go_out=. --go_opt=paths=source_relative --go-grpc_out=. --go-grpc_opt=paths=source_relative grpcapi/*.proto
      - name: Check that code is updated
        run: go get -u ./... && go mod tidy && go get -u ./... && git diff --exit-code
